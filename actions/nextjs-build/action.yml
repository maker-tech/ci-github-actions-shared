# Composite Action: Build Next.js
# Runs npm ci and npm run build for Next.js projects
#
# Usage:
#   - uses: maker-tech/ci-github-actions-shared/actions/nextjs-build@v1
#     with:
#       working_directory: "."
#       package_manager: pnpm

name: Build Next.js
description: 'Install dependencies and build a Next.js application'

inputs:
  package_manager:
    description: 'Package manager to use (pnpm or npm)'
    required: false
    default: 'pnpm'
  working_directory:
    description: 'Working directory containing the Next.js app'
    required: false
    default: '.'
  build_command:
    description: 'Build command to run (leave blank to use defaults)'
    required: false
    default: ''
  skip_install:
    description: 'Skip installing dependencies (if already installed)'
    required: false
    default: 'false'

outputs:
  build_directory:
    description: 'Path to the build output directory'
    value: ${{ inputs.working_directory }}/.next

runs:
  using: composite
  steps:
    - name: Install dependencies
      if: inputs.skip_install != 'true'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        set -euo pipefail
        if [[ "${{ inputs.package_manager }}" == "pnpm" ]]; then
          pnpm install --frozen-lockfile
        else
          npm ci
        fi

    - name: Build Next.js
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        set -euo pipefail
        if [[ -n "${{ inputs.build_command }}" ]]; then
          CMD="${{ inputs.build_command }}"
        else
          if [[ "${{ inputs.package_manager }}" == "pnpm" ]]; then
            CMD="pnpm build"
          else
            CMD="npm run build"
          fi
        fi

        echo "Running: $CMD"
        eval "$CMD"
      env:
        NEXT_TELEMETRY_DISABLED: '1'
