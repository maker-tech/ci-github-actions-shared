# Copy this file to your repository's .github/workflows/ directory.
#
# Release after successful Vercel auto-deployment — triggers on deployment_status
# events from platforms with native auto-deploy (e.g. Vercel, Netlify).
#
# Only creates a release when:
#   1. The production deployment succeeds
#   2. The last commit is not automated (prevents loops from version bump deploys)
#
# Use this pattern when your platform auto-deploys on push and reports back
# via GitHub Deployment Status events. For platforms where you deploy via
# GitHub Actions (Vercel CLI, AWS, GCP), use promote-deploy-release.yml instead.
#
# Calls:
#   - maker-tech/ci-github-actions-shared/.github/workflows/release-version.yml
#
# Triggers: deployment_status (from platform's GitHub integration)
# Required secrets: CI_GITHUB_TOKEN (fine-grained PAT with Contents: Read and write)
# Permissions: contents: write
#
# IMPORTANT: When using this pattern, remove any separate release-version.yml
# workflow that triggers on push to main — otherwise you will get duplicate releases.

name: Release Version

on:
  deployment_status:

permissions:
  contents: write

jobs:
  release:
    name: 'Create Release'
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production'
    uses: maker-tech/ci-github-actions-shared/.github/workflows/release-version.yml@v1
    with:
      release_branch: main # required -- branch where releases are created
      sync_branch: dev     # required -- branch to sync after release (set to '' to disable)
      skip_automated_commits: true
      ## Optional (uncomment to override defaults)
      # preset: conventionalcommits  # Changelog preset -- options: conventionalcommits, eslint
      # output_file: CHANGELOG.md    # Changelog output file
      # skip_on_empty: false         # Skip release if no conventional commits found
      # release_count: 5             # Releases to keep in changelog (0 = all)
    secrets:
      CI_GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }} # required -- admin token for protected branches and releases
      ## Optional secrets (uncomment if needed)
      # SLACK_WEBHOOK: ${{ secrets.SLACK_APP_WEBHOOK }} # Slack webhook for release/failure notifications
