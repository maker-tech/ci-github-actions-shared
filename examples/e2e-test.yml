# Copy this file to your repository's .github/workflows/ directory.
#
# E2E Tests -- Sharded Playwright E2E tests against a target URL
# Calls: maker-tech/ci-github-actions-shared/.github/workflows/e2e-test.yml
#
# Triggers: push to dev (excluding docs/config changes), manual dispatch
# Required secrets: none (BASIC_AUTH_*, SLACK_WEBHOOK, VERCEL_CI_WAF_BYPASS, E2E_EXTRA_ENV are optional)
# VERCEL_CI_WAF_BYPASS: scope the header to the BASE_URL origin with context.route(),
# never extraHTTPHeaders (it breaks CORS calls to third-party APIs). See the README.
# Permissions: contents: read (default)

name: E2E Tests DEV

on:
  push:
    branches: [dev]
    paths-ignore:
      - '.github/**'
      - '.husky/**'
      - '.cursor/**'
      - 'docs/**'
      - '**/*.md'
      - 'package.json'
      - 'CHANGELOG.md'
  workflow_dispatch:

jobs:
  e2e:
    name: 'E2E Tests'
    uses: maker-tech/ci-github-actions-shared/.github/workflows/e2e-test.yml@v2
    with:
      target_url: https://dev.example.com # required -- target URL to run tests against
      ## Optional (uncomment to override defaults)
      # playwright_version: ''                                # Exact version; empty = @playwright/test from package_json_path (fallback 1.55.1)
      # package_json_path: package.json                       # Where to read @playwright/test from; monorepo e.g. website/package.json
      # axe_core_version: '4.11.0'                            # Axe accessibility testing library version
      # dotenv_version: '17.4.2'                              # dotenv version
      # node_version: '24'                                    # Node.js version
      # test_browser: chromium                                # options: chromium, firefox, webkit
      # shard_total: 4                                        # Number of parallel shards
      # fail_fast: false                                      # Cancel remaining shards when one fails
      # artifact_retention_days: 30                           # Days to keep test report artifacts
      # fail_screenshots_path: 'tests/functional/screenshots/**' # Path to failure screenshots
    secrets:
      ## Optional secrets (uncomment if needed)
      # BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}         # Basic auth username for protected environments
      # BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }} # Basic auth password for protected environments
      # VERCEL_CI_WAF_BYPASS: ${{ secrets.VERCEL_CI_WAF_BYPASS }} # Vercel Firewall CI bypass (x-vercel-ci-waf-bypass, scoped to BASE_URL origin)
      # SLACK_WEBHOOK: ${{ secrets.SLACK_APP_WEBHOOK }}        # Slack webhook for failure notifications
      # E2E_EXTRA_ENV: |                                       # Project-specific env vars for the test step, one KEY=value per line
      #   MY_TESTING_BYPASS_KEY=${{ secrets.MY_TESTING_BYPASS_KEY }}
