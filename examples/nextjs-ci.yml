# Copy this file to your repository's .github/workflows/ directory.
#
# Next.js CI -- Lint, typecheck, and test
# Calls: maker-tech/ci-github-actions-shared/.github/workflows/nextjs-ci.yml
#
# This is the lightweight option for branches that do NOT use required status
# checks. For protected branches, required checks, or Renovate automerge, use
# quality-checks.yml instead.
#
# WARNING: This workflow uses paths-ignore, which is INCOMPATIBLE with required
# status checks (branch protection rulesets). If all changed files match the
# ignore list, the workflow never fires and the required check deadlocks the PR.
# Use quality-checks.yml instead when your branch has required status checks.
#
# Triggers: pull requests (excluding docs/config changes)
# Required secrets: none
# Permissions: contents: read (default)

name: CI

on:
  pull_request:
    paths-ignore:
      - '.github/**'
      - '.husky/**'
      - '.cursor/**'
      - 'docs/**'
      - '**/*.md'
      - 'package.json'
      - 'CHANGELOG.md'

jobs:
  ci:
    name: 'CI'
    uses: maker-tech/ci-github-actions-shared/.github/workflows/nextjs-ci.yml@v2
    with:
      package_manager: pnpm # required -- options: pnpm, npm
      ## Optional (uncomment to override defaults)
      # ci_ref: main                  # Ref of ci-github-actions-shared to checkout (tag, branch, or SHA)
      # pnpm_version: '10.28.2'      # pnpm version (when package_manager=pnpm)
      # node_version: '24.19.0'      # Node.js version
      # working_directory: '.'        # Directory containing the Next.js app
      # run_lint: true                # Run linting
      # run_tests: true               # Run tests
      # run_typecheck: true           # Run TypeScript type checking
