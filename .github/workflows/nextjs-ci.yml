# Reusable workflow: Next.js CI (lint + test)
# Usage:
#   jobs:
#     ci:
#       uses: maker-tech/ci-github-actions-shared/.github/workflows/nextjs-ci.yml@v1
#       with:
#         package_manager: pnpm
#         pnpm_version: 10.28.2
#         node_version: 22.12.0
#         # ci_ref: main  # Ref of ci-github-actions-shared to checkout (tag, branch, or SHA)

name: Next.js CI

on:
  workflow_call:
    inputs:
      ci_ref:
        description: 'Ref of ci-github-actions-shared to checkout (tag, branch, or SHA). Defaults to main.'
        type: string
        default: 'main'
      package_manager:
        description: 'Package manager to use (pnpm or npm)'
        type: string
        default: 'pnpm'
      pnpm_version:
        description: 'pnpm version (when package_manager=pnpm)'
        type: string
        default: '10.28.2'
      node_version:
        description: 'Node.js version to use'
        type: string
        default: '22.12.0'
      working_directory:
        description: 'Directory containing the Next.js app'
        type: string
        default: '.'
      run_lint:
        description: 'Whether to run linting'
        type: boolean
        default: true
      run_tests:
        description: 'Whether to run tests'
        type: boolean
        default: true
      run_typecheck:
        description: 'Whether to run TypeScript type checking'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ci-lint-typecheck-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4
        with:
          path: app
          ref: ${{ github.sha }}

      - name: Checkout ci-github-actions-shared repo (for local composite actions)
        uses: actions/checkout@v4
        with:
          repository: maker-tech/ci-github-actions-shared
          ref: ${{ inputs.ci_ref }}
          path: ci-github-actions-shared
          token: ${{ github.token }}

      - name: Resolve working directory
        id: resolve-wd
        shell: bash
        run: |
          wd="${{ inputs.working_directory }}"
          if [[ "$wd" == "." || -z "$wd" ]]; then
            echo "path=app" >> "$GITHUB_OUTPUT"
          else
            echo "path=app/$wd" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js + install deps
        uses: ./ci-github-actions-shared/actions/setup-node
        with:
          package_manager: ${{ inputs.package_manager }}
          pnpm_version: ${{ inputs.pnpm_version }}
          node_version: ${{ inputs.node_version }}
          working_directory: ${{ steps.resolve-wd.outputs.path }}
          install_dependencies: 'true'

      - name: Lint
        if: inputs.run_lint
        shell: bash
        working-directory: ${{ steps.resolve-wd.outputs.path }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.package_manager }}" == "pnpm" ]]; then
            pnpm lint
          else
            npm run lint
          fi

      - name: Type check
        if: inputs.run_typecheck
        shell: bash
        working-directory: ${{ steps.resolve-wd.outputs.path }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.package_manager }}" == "pnpm" ]]; then
            pnpm type-check || pnpm typecheck || echo "No type-check script found"
          else
            npm run typecheck || npm run type-check || echo "No typecheck script found"
          fi

      - name: Test
        if: inputs.run_tests
        shell: bash
        working-directory: ${{ steps.resolve-wd.outputs.path }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.package_manager }}" == "pnpm" ]]; then
            pnpm test || pnpm test:ci || echo "No test script found"
          else
            npm test || npm run test:ci || echo "No test script found"
          fi
