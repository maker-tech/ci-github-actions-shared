# Reusable workflow: Next.js CI (lint + test)
# Usage:
#   jobs:
#     ci:
#       uses: maker-tech/ci-github-actions-shared/.github/workflows/nextjs-ci.yml@v2
#       with:
#         package_manager: pnpm
#         pnpm_version: 10.28.2
#         node_version: 24.19.0
#         # ci_ref: main  # Ref of ci-github-actions-shared to checkout (tag, branch, or SHA)

name: Next.js CI

on:
  workflow_call:
    inputs:
      ci_ref:
        description: 'Ref of ci-github-actions-shared to checkout (tag, branch, or SHA). Defaults to main.'
        type: string
        default: 'main'
      package_manager:
        description: 'Package manager to use (pnpm or npm)'
        type: string
        default: 'pnpm'
      pnpm_version:
        description: 'pnpm version (when package_manager=pnpm)'
        type: string
        default: '10.28.2'
      node_version:
        description: 'Node.js version to use'
        type: string
        default: '24.19.0'
      working_directory:
        description: 'Directory containing the Next.js app'
        type: string
        default: '.'
      run_lint:
        description: 'Whether to run linting'
        type: boolean
        default: true
      run_tests:
        description: 'Whether to run tests'
        type: boolean
        default: true
      run_typecheck:
        description: 'Whether to run TypeScript type checking'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ci-lint-typecheck-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: app
          ref: ${{ github.sha }}

      - name: Checkout ci-github-actions-shared repo (for local composite actions)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: maker-tech/ci-github-actions-shared
          ref: ${{ inputs.ci_ref }}
          path: ci-github-actions-shared
          token: ${{ github.token }}

      - name: Resolve working directory
        id: resolve-wd
        shell: bash
        run: |
          wd="${{ inputs.working_directory }}"
          if [[ "$wd" == "." || -z "$wd" ]]; then
            echo "path=app" >> "$GITHUB_OUTPUT"
          else
            echo "path=app/$wd" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js + install deps
        uses: ./ci-github-actions-shared/actions/setup-node
        with:
          package_manager: ${{ inputs.package_manager }}
          pnpm_version: ${{ inputs.pnpm_version }}
          node_version: ${{ inputs.node_version }}
          working_directory: ${{ steps.resolve-wd.outputs.path }}
          install_dependencies: 'true'

      - name: Lint
        if: inputs.run_lint
        shell: bash
        working-directory: ${{ steps.resolve-wd.outputs.path }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.package_manager }}" == "pnpm" ]]; then
            pnpm lint
          else
            npm run lint
          fi

      - name: Type check
        if: inputs.run_typecheck
        shell: bash
        working-directory: ${{ steps.resolve-wd.outputs.path }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        # Choose the script by name, then run it with no fallback, so a type error fails the step.
        run: |
          set -euo pipefail
          has_script() { node -e "process.exit(require('./package.json').scripts?.[process.argv[1]] ? 0 : 1)" "$1"; }
          if has_script type-check; then
            script="type-check"
          elif has_script typecheck; then
            script="typecheck"
          else
            echo "::notice::No type-check or typecheck script in package.json, skipping"
            exit 0
          fi
          if [[ "$PACKAGE_MANAGER" == "pnpm" ]]; then pnpm run "$script"; else npm run "$script"; fi

      - name: Test
        if: inputs.run_tests
        shell: bash
        working-directory: ${{ steps.resolve-wd.outputs.path }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        # Choose the script by name, then run it with no fallback, so a failing test fails the step.
        run: |
          set -euo pipefail
          has_script() { node -e "process.exit(require('./package.json').scripts?.[process.argv[1]] ? 0 : 1)" "$1"; }
          if has_script test; then
            script="test"
          elif has_script test:ci; then
            script="test:ci"
          else
            echo "::notice::No test or test:ci script in package.json, skipping"
            exit 0
          fi
          if [[ "$PACKAGE_MANAGER" == "pnpm" ]]; then pnpm run "$script"; else npm run "$script"; fi
