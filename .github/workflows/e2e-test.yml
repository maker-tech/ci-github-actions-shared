# Reusable workflow: E2E Tests (Playwright, sharded)
#
# Runs Playwright E2E tests against a target URL with parallel sharding.
# Uses minimal dependencies (Playwright + Axe only, not full project deps).
#
# Note: triggers (push to dev, paths-ignore, etc.) belong in the calling repo.
# Usage:
#   jobs:
#     e2e:
#       uses: maker-tech/ci-github-actions-shared/.github/workflows/e2e-test.yml@v2
#       with:
#         target_url: https://dev.example.com
#       secrets:
#         BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
#         BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
#         VERCEL_CI_WAF_BYPASS: ${{ secrets.VERCEL_CI_WAF_BYPASS }}
#         SLACK_WEBHOOK: ${{ secrets.SLACK_APP_WEBHOOK }}
#         # Optional: project-specific env vars for the test run, one KEY=value per line
#         E2E_EXTRA_ENV: |
#           MY_TESTING_BYPASS_KEY=${{ secrets.MY_TESTING_BYPASS_KEY }}
#
# Playwright version: leave `playwright_version` empty to use the exact version of
# @playwright/test in the caller's package.json (falls back to 1.55.1). In a monorepo,
# set `package_json_path` (e.g. website/package.json) to read it from a subfolder.
#
# VERCEL_CI_WAF_BYPASS: do NOT put it in `extraHTTPHeaders`. That sends the header to
# every host, and third-party APIs (e.g. a headless CMS) reject it in CORS preflight.
# Add it with `context.route()` scoped to the BASE_URL origin instead. See the README.
#

name: E2E Tests

on:
  workflow_call:
    inputs:
      playwright_version:
        description: 'Exact Playwright version. Empty reads @playwright/test from package_json_path, falling back to 1.55.1.'
        type: string
        default: ''
      package_json_path:
        description: 'package.json to read @playwright/test from when playwright_version is empty, relative to the repo root (e.g. website/package.json in a monorepo)'
        type: string
        default: 'package.json'
      axe_core_version:
        description: 'Axe accessibility testing library version'
        type: string
        default: '4.11.0'
      dotenv_version:
        description: 'dotenv version installed alongside Playwright'
        type: string
        default: '17.4.2'
      node_version:
        description: 'Node.js version'
        type: string
        default: '24'
      target_url:
        description: 'Target URL to run tests against'
        type: string
        required: true
      test_browser:
        description: 'Browser to install and test with (chromium/firefox/webkit)'
        type: string
        default: 'chromium'
      shard_total:
        description: 'Number of parallel shards'
        type: number
        default: 4
      fail_fast:
        description: 'Cancel remaining shards when one fails. Default false so every shard reports its own failures.'
        type: boolean
        default: false
      artifact_retention_days:
        description: 'Days to keep test report artifacts'
        type: number
        default: 30
      fail_screenshots_path:
        description: 'Path to failure screenshots'
        type: string
        default: 'tests/functional/screenshots/**'
    secrets:
      BASIC_AUTH_USER:
        description: 'Basic auth username for protected environments (optional)'
        required: false
      BASIC_AUTH_PASSWORD:
        description: 'Basic auth password for protected environments (optional)'
        required: false
      SLACK_WEBHOOK:
        description: 'Slack webhook for failure notifications (optional)'
        required: false
      VERCEL_CI_WAF_BYPASS:
        description: 'Value for x-vercel-ci-waf-bypass (Vercel Firewall CI bypass; optional)'
        required: false
      E2E_EXTRA_ENV:
        description: 'Extra env vars for the Playwright run, one KEY=value per line (optional). Use for project-specific secrets.'
        required: false

permissions:
  contents: read

jobs:
  setup:
    name: Prepare shard matrix
    runs-on: ubuntu-latest
    outputs:
      shard_indices: ${{ steps.set-shards.outputs.indices }}
    steps:
      - name: Generate shard indices
        id: set-shards
        shell: bash
        run: |
          indices=$(seq 1 ${{ inputs.shard_total }} | jq -R 'tonumber' | jq -s -c '.')
          echo "indices=$indices" >> "$GITHUB_OUTPUT"

  e2e-test:
    needs: setup
    strategy:
      fail-fast: ${{ inputs.fail_fast }}
      matrix:
        shardIndex: ${{ fromJSON(needs.setup.outputs.shard_indices) }}
    name: 'E2E Shard ${{ matrix.shardIndex }}/${{ inputs.shard_total }}'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: ${{ inputs.node_version }}
          package-manager-cache: false # Disable package manager cache to avoid conflicts with pnpm

      - name: Resolve Playwright version
        id: playwright-version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.playwright_version }}
          PACKAGE_JSON_PATH: ${{ inputs.package_json_path }}
          FALLBACK_VERSION: '1.55.1'
        run: |
          # Must run before package.json is swapped out in the install step.
          node <<'EOF' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const path = require('path');
          const semver = /[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?/;
          const fallback = process.env.FALLBACK_VERSION;
          const pkgPath = (process.env.PACKAGE_JSON_PATH || '').trim() || 'package.json';
          const isDefaultPath = path.normalize(pkgPath) === 'package.json';
          let version = (process.env.INPUT_VERSION || '').trim();
          let source = 'playwright_version input';

          if (version) {
            const match = version.match(semver);
            if (!match) {
              console.error(`::error::playwright_version "${version}" is not a valid version`);
              process.exit(1);
            }
            version = match[0];
          } else {
            const root = process.cwd();
            const resolved = path.resolve(root, pkgPath);
            if (path.isAbsolute(pkgPath) || !resolved.startsWith(root + path.sep)) {
              console.error(`::error::package_json_path "${pkgPath}" must be a relative path inside the repository`);
              process.exit(1);
            }
            let spec;
            try {
              const pkg = JSON.parse(fs.readFileSync(resolved, 'utf8'));
              spec = pkg.devDependencies?.['@playwright/test'] ?? pkg.dependencies?.['@playwright/test'];
            } catch (err) {
              // An explicitly configured path that can't be read is a caller mistake: fail loudly.
              if (!isDefaultPath) {
                console.error(`::error::Could not read package_json_path "${pkgPath}": ${err.message}`);
                process.exit(1);
              }
              console.error(`::warning::Could not read ${pkgPath}: ${err.message}`);
            }
            const match = spec && String(spec).match(semver);
            if (match) {
              version = match[0];
              source = `${pkgPath} (${spec})`;
            } else {
              version = fallback;
              source = 'fallback';
              console.error(`::warning::@playwright/test is missing or unparseable in ${pkgPath} (${spec ?? 'missing'}); using ${fallback}. Set package_json_path if it lives in a subfolder, or set playwright_version.`);
            }
          }

          console.error(`Using Playwright ${version} from ${source}`);
          process.stdout.write(`version=${version}\n`);
          EOF

      - name: Install minimal Playwright dependencies
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          PLAYWRIGHT_VERSION: ${{ steps.playwright-version.outputs.version }}
          AXE_CORE_VERSION: ${{ inputs.axe_core_version }}
          DOTENV_VERSION: ${{ inputs.dotenv_version }}
        run: |
          # Replace package.json to avoid installing full project dependencies
          # We only need: @playwright/test, @axe-core/playwright, and dotenv
          mv package.json package.json.original
          echo '{"name":"e2e-tests","version":"1.0.0"}' > package.json
          npm install \
            "@playwright/test@${PLAYWRIGHT_VERSION}" \
            "@axe-core/playwright@${AXE_CORE_VERSION}" \
            "dotenv@${DOTENV_VERSION}"

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ inputs.test_browser }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ inputs.test_browser }}-

      - name: Install Playwright browsers
        shell: bash
        run: npx playwright install ${{ inputs.test_browser }} --with-deps

      - name: Run Playwright tests (Shard ${{ matrix.shardIndex }}/${{ inputs.shard_total }})
        shell: bash
        env:
          CI: true
          BASE_URL: ${{ inputs.target_url }}
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
          VERCEL_CI_WAF_BYPASS: ${{ secrets.VERCEL_CI_WAF_BYPASS }}
          E2E_EXTRA_ENV: ${{ secrets.E2E_EXTRA_ENV }}
        run: |
          # Export E2E_EXTRA_ENV (KEY=value per line) into this step only. It is parsed,
          # not sourced, and not written to GITHUB_ENV, so later steps never see it.
          if [[ -n "${E2E_EXTRA_ENV}" ]]; then
            while IFS= read -r line || [[ -n "$line" ]]; do
              line="${line%$'\r'}"
              [[ -z "${line//[[:space:]]/}" || "$line" =~ ^[[:space:]]*# ]] && continue
              if [[ "$line" != *=* ]]; then
                echo "::error::E2E_EXTRA_ENV has a line without '=' (expected KEY=value)"
                exit 1
              fi
              key="${line%%=*}"
              key="${key#"${key%%[![:space:]]*}"}"
              key="${key%"${key##*[![:space:]]}"}"
              if [[ ! "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
                echo "::error::E2E_EXTRA_ENV has an invalid variable name: ${key}"
                exit 1
              fi
              export "${key}=${line#*=}"
              echo "E2E_EXTRA_ENV: exported ${key}"
            done <<< "${E2E_EXTRA_ENV}"
            unset E2E_EXTRA_ENV
          fi
          npx playwright test --shard=${{ matrix.shardIndex }}/${{ inputs.shard_total }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ always() }}
        with:
          name: playwright-report-shard-${{ matrix.shardIndex }}
          path: playwright-report/
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Upload failure screenshots
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ failure() }}
        with:
          name: e2e-fail-screenshots-shard-${{ matrix.shardIndex }}
          path: ${{ inputs.fail_screenshots_path }}

      - name: Check Slack webhook availability
        id: slack
        if: failure()
        shell: bash
        run: echo "available=${{ secrets.SLACK_WEBHOOK != '' }}" >> "$GITHUB_OUTPUT"

      - name: Send Slack notification on failure
        if: ${{ failure() && steps.slack.outputs.available == 'true' }}
        uses: rtCamp/action-slack-notify@c58b60ee33df2229ed2d2eed86eeaf7e6c527c5a
        env:
          SLACK_COLOR: ${{ job.status }}
          SLACK_ICON_EMOJI: ':eyes:'
          SLACK_MESSAGE: 'E2E Tests (Shard ${{ matrix.shardIndex }}/${{ inputs.shard_total }}) against ${{ inputs.target_url }} exited with status: ${{ job.status }}'
          SLACK_TITLE: 'Status:'
          SLACK_USERNAME: Github
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
