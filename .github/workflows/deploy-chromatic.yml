# Reusable workflow: Deploy Chromatic
#
# Note: triggers (push to uat, paths-ignore, etc.) belong in the calling repo.
# Usage:
#   jobs:
#     chromatic:
#       uses: maker-tech/ci-github-actions-shared/.github/workflows/deploy-chromatic.yml@v1
#       with:
#         package_manager: pnpm
#         pnpm_version: 10.28.2
#         working_directory: .
#         # ci_ref: main  # Ref of ci-github-actions-shared to checkout (tag, branch, or SHA)
#         # Optional: pass extra environment variables as KEY=VALUE lines.
#         # IMPORTANT: extra_env is a workflow input (plain text) — values are visible
#         # in logs and the Actions UI. Only use vars.* (public repository variables).
#         # Never pass secrets via extra_env. If you need a secret in the build, add it
#         # as a named secret on this workflow and pass it via the secrets: block.
#         extra_env: |
#           NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ vars.CLOUDINARY_CLOUD_NAME }}
#       secrets:
#         CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
#

name: Deploy Chromatic

on:
  workflow_call:
    inputs:
      ci_ref:
        description: 'Ref of ci-github-actions-shared to checkout (tag, branch, or SHA). Defaults to main.'
        type: string
        default: 'main'
      package_manager:
        description: 'Package manager to use (pnpm or npm)'
        type: string
        default: 'pnpm'
      pnpm_version:
        description: 'pnpm version (when package_manager=pnpm)'
        type: string
        default: '10.28.2'
      node_version:
        description: 'Node.js version to use'
        type: string
        default: '22.12.0'
      working_directory:
        description: 'Directory containing the app'
        type: string
        default: '.'
      fetch_depth:
        description: 'Git fetch depth (0 for full history)'
        type: number
        default: 0
      chromatic_command:
        description: 'Command to run Chromatic (leave blank to use defaults)'
        type: string
        default: ''
      extra_env:
        description: 'Extra environment variables as newline-separated KEY=VALUE pairs'
        type: string
        default: ''
    secrets:
      CHROMATIC_PROJECT_TOKEN:
        description: 'Chromatic project token'
        required: true

permissions:
  contents: read

jobs:
  chromatic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4
        with:
          path: app
          ref: ${{ github.sha }}
          fetch-depth: ${{ inputs.fetch_depth }}

      - name: Checkout ci-github-actions-shared repo (for local composite actions)
        uses: actions/checkout@v4
        with:
          repository: maker-tech/ci-github-actions-shared
          ref: ${{ inputs.ci_ref }}
          path: ci-github-actions-shared
          token: ${{ github.token }}

      - name: Resolve working directory
        id: resolve-wd
        shell: bash
        run: |
          wd="${{ inputs.working_directory }}"
          if [[ "$wd" == "." || -z "$wd" ]]; then
            echo "path=app" >> "$GITHUB_OUTPUT"
          else
            echo "path=app/$wd" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js + install deps
        uses: ./ci-github-actions-shared/actions/setup-node
        with:
          package_manager: ${{ inputs.package_manager }}
          pnpm_version: ${{ inputs.pnpm_version }}
          node_version: ${{ inputs.node_version }}
          working_directory: ${{ steps.resolve-wd.outputs.path }}
          install_dependencies: 'true'

      - name: Run Chromatic
        shell: bash
        working-directory: ${{ steps.resolve-wd.outputs.path }}
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          set -euo pipefail

          # Export any additional env vars passed in as KEY=VALUE lines.
          if [[ -n "${{ inputs.extra_env }}" ]]; then
            while IFS= read -r line; do
              [[ -z "$line" ]] && continue
              [[ "$line" =~ ^[[:space:]]*# ]] && continue
              if [[ "$line" == *"="* ]]; then
                # shellcheck disable=SC2163
                export "$line"
              fi
            done <<< "${{ inputs.extra_env }}"
          fi

          if [[ -n "${{ inputs.chromatic_command }}" ]]; then
            CMD="${{ inputs.chromatic_command }}"
          else
            if [[ "${{ inputs.package_manager }}" == "pnpm" ]]; then
              CMD="pnpm chromatic:ci"
            else
              CMD="npm run chromatic:ci"
            fi
          fi

          echo "Running: $CMD"
          eval "$CMD"
