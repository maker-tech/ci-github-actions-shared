# Reusable workflow: Lint PR title using Conventional Commits
#
# Note: triggers belong in the calling repo.
# Usage:
#   on:
#     pull_request:
#       types: [opened, edited, synchronize, reopened]
#   jobs:
#     lint:
#       uses: maker-tech/ci-github-actions-shared/.github/workflows/lint-pr-title.yml@v1
#       with:
#         preset: eslint  # default: conventionalcommits
#

name: Lint PR title

on:
  workflow_call:
    inputs:
      preset:
        description: 'Commit convention preset (conventionalcommits or eslint)'
        type: string
        default: 'conventionalcommits'

permissions:
  pull-requests: read

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate
        if: inputs.preset != 'eslint'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate (eslint preset)
        if: inputs.preset == 'eslint'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        with:
          types: |
            fix
            update
            new
            breaking
            docs
            build
            upgrade
            chore
        env:
          GITHUB_TOKEN: ${{ github.token }}
