# Reusable workflow: Sync GitHub labels
#
# Syncs the repository's GitHub labels from a base set of labels defined in this
# shared repo (.github/repo-labels.json). Consumer repos can optionally provide
# an additional labels file for repo-specific labels.
#
# Usage:
#   jobs:
#     sync-labels:
#       uses: maker-tech/ci-github-actions-shared/.github/workflows/repo-sync-labels.yml@v1
#       permissions:
#         contents: read
#         issues: write
#
# Usage with extra consumer-specific labels:
#   jobs:
#     sync-labels:
#       uses: maker-tech/ci-github-actions-shared/.github/workflows/repo-sync-labels.yml@v1
#       with:
#         extra_labels_file: .github/repo-labels.json
#       permissions:
#         contents: read
#         issues: write

name: Repo - Sync Labels

on:
  workflow_call:
    inputs:
      extra_labels_file:
        description: 'Path to an additional labels JSON file in the consumer repo (relative to repo root). Leave empty to only use the base labels from the shared repo.'
        type: string
        default: ''
      delete_other_labels:
        description: 'Whether to delete labels not defined in config'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  sync-labels:
    name: Sync Labels
    runs-on: ubuntu-latest

    steps:
      - name: Determine ci-github-actions-shared ref
        id: ci_ref
        shell: bash
        run: |
          set -euo pipefail
          wf_ref='${{ github.workflow_ref }}'
          ref="${wf_ref##*@}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout consumer repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout ci-github-actions-shared repo
        uses: actions/checkout@v4
        with:
          repository: maker-tech/ci-github-actions-shared
          ref: ${{ steps.ci_ref.outputs.ref }}
          path: ci-github-actions-shared
          token: ${{ github.token }}

      - name: Build config-file list
        id: config
        shell: bash
        run: |
          set -euo pipefail
          config_files="ci-github-actions-shared/.github/repo-labels.json"
          if [[ -n "${{ inputs.extra_labels_file }}" ]]; then
            config_files="${config_files}"$'\n'"app/${{ inputs.extra_labels_file }}"
          fi
          # Use heredoc to handle multiline output
          {
            echo "files<<EOF"
            echo "$config_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Sync labels
        uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2
        with:
          config-file: ${{ steps.config.outputs.files }}
          delete-other-labels: ${{ inputs.delete_other_labels }}
          dry-run: false
